<svg width="960" height="400" viewBox="0 0 960 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Capability monitor: Python, Claude API and agents, TypeScript, web, cloud">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <style>
      text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 14px; }
      .name { fill: #d7def2; }
      .lvl { fill: #4ade80; }
      .lvl2 { fill: #fbbf24; }
      .note { fill: #5f6a8c; }
      .track { fill: #ffffff; fill-opacity: 0.06; }
      .fill { fill: url(#bar); transform-origin: 300px 0; animation: grow 1.4s cubic-bezier(0.2,0.7,0.3,1) both; }
      .b1{animation-delay:.15s}.b2{animation-delay:.3s}.b3{animation-delay:.45s}.b4{animation-delay:.6s}.b5{animation-delay:.75s}.b6{animation-delay:.9s}.b7{animation-delay:1.05s}.b8{animation-delay:1.2s}
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <rect width="960" height="400" rx="14" fill="#0b1020"/>
  <rect x="0.5" y="0.5" width="959" height="399" rx="13.5" stroke="#ffffff" stroke-opacity="0.09"/>
  <path d="M0 14C0 6.268 6.268 0 14 0H946C953.732 0 960 6.268 960 14V38H0V14Z" fill="#0d1424"/>
  <line x1="0" y1="38" x2="960" y2="38" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="24" cy="19" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="19" r="5.5" fill="#febc2e"/>
  <circle cx="64" cy="19" r="5.5" fill="#28c840"/>
  <text x="480" y="24" font-size="13" fill="#8b95b5" text-anchor="middle">capability-monitor — live</text>

  <text x="56" y="72"><tspan fill="#22d3ee" font-weight="700">&#10095;</tspan><tspan fill="#e2e8f0"> agent.stack(</tspan><tspan fill="#a5f3a5">verbose=True</tspan><tspan fill="#e2e8f0">)</tspan></text>

  <!-- rows: name | bar 300px | level | note -->
  <g>
    <text x="56" y="112" class="name">Python</text>
    <rect x="300" y="100" width="300" height="12" rx="6" class="track"/>
    <rect x="300" y="100" width="240" height="12" rx="6" class="fill b1"/>
    <text x="622" y="112" class="lvl">daily driver</text><text x="760" y="112" class="note">AI tooling &#183; scripting</text>
  </g>
  <g>
    <text x="56" y="146" class="name">Claude API &#183; MCP &#183; Agents</text>
    <rect x="300" y="134" width="300" height="12" rx="6" class="track"/>
    <rect x="300" y="134" width="216" height="12" rx="6" class="fill b2"/>
    <text x="622" y="146" class="lvl">core focus</text><text x="760" y="146" class="note">agent workflows</text>
  </g>
  <g>
    <text x="56" y="180" class="name">Prompt Engineering</text>
    <rect x="300" y="168" width="300" height="12" rx="6" class="track"/>
    <rect x="300" y="168" width="234" height="12" rx="6" class="fill b3"/>
    <text x="622" y="180" class="lvl">daily practice</text>
  </g>
  <g>
    <text x="56" y="214" class="name">TypeScript &#183; Next.js</text>
    <rect x="300" y="202" width="300" height="12" rx="6" class="track"/>
    <rect x="300" y="202" width="192" height="12" rx="6" class="fill b4"/>
    <text x="622" y="214" class="lvl">building with</text><text x="760" y="214" class="note">Iron Fortress</text>
  </g>
  <g>
    <text x="56" y="248" class="name">HTML &#183; CSS &#183; JavaScript</text>
    <rect x="300" y="236" width="300" height="12" rx="6" class="track"/>
    <rect x="300" y="236" width="204" height="12" rx="6" class="fill b5"/>
    <text x="622" y="248" class="lvl">solid</text>
  </g>
  <g>
    <text x="56" y="282" class="name">PHP &#183; WordPress</text>
    <rect x="300" y="270" width="300" height="12" rx="6" class="track"/>
    <rect x="300" y="270" width="150" height="12" rx="6" class="fill b6"/>
    <text x="622" y="282" class="lvl2">in training</text>
  </g>
  <g>
    <text x="56" y="316" class="name">AWS &#183; Supabase &#183; Stripe</text>
    <rect x="300" y="304" width="300" height="12" rx="6" class="track"/>
    <rect x="300" y="304" width="132" height="12" rx="6" class="fill b7"/>
    <text x="622" y="316" class="lvl2">leveling up</text><text x="760" y="316" class="note">AWS CP certified</text>
  </g>
  <g>
    <text x="56" y="350" class="name">Java</text>
    <rect x="300" y="338" width="300" height="12" rx="6" class="track"/>
    <rect x="300" y="338" width="108" height="12" rx="6" class="fill b8"/>
    <text x="622" y="350" class="lvl2">foundations</text><text x="760" y="350" class="note">Oracle certified</text>
  </g>

  <text x="56" y="384" class="note">honest levels — every bar is a conversation starter, not a claim</text>
</svg>
