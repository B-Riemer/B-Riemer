<svg width="960" height="400" viewBox="0 0 960 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Capability monitor: TypeScript and Next.js, web fundamentals, Supabase and Stripe, Python, RAG and embeddings, AWS, Java — each anchored to a repository or certificate">
  <defs>
    <linearGradient id="bar" x1="290" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <style>
      text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 14px; }
      .name { fill: #d7def2; }
      .lvl { fill: #4ade80; }
      .lvl2 { fill: #fbbf24; }
      .note { fill: #5f6a8c; }
      .track { fill: #ffffff; fill-opacity: 0.06; }
      /* No entrance animation: GitHub applies these styles but does not run
         CSS animations on SVGs embedded in a README, so a bar that animated
         from scaleX(0) would stay invisible forever. The bars are drawn at
         their final width instead. */
      .fill { fill: url(#bar); }
    </style>
  </defs>

  <rect width="960" height="400" rx="14" fill="#0b1020"/>
  <rect x="0.5" y="0.5" width="959" height="399" rx="13.5" stroke="#ffffff" stroke-opacity="0.09"/>
  <path d="M0 14C0 6.268 6.268 0 14 0H946C953.732 0 960 6.268 960 14V38H0V14Z" fill="#0d1424"/>
  <line x1="0" y1="38" x2="960" y2="38" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="24" cy="19" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="19" r="5.5" fill="#febc2e"/>
  <circle cx="64" cy="19" r="5.5" fill="#28c840"/>
  <text x="480" y="24" font-size="13" fill="#8b95b5" text-anchor="middle">capability-monitor — evidence mode</text>

  <text x="56" y="72"><tspan fill="#22d3ee" font-weight="700">&#10095;</tspan><tspan fill="#e2e8f0"> agent.stack(</tspan><tspan fill="#a5f3a5">show_receipts=True</tspan><tspan fill="#e2e8f0">)</tspan></text>

  <!-- rows: name | bar 270px | level | receipt -->
  <g>
    <text x="56" y="112" class="name">TypeScript &#183; Next.js</text>
    <rect x="290" y="100" width="270" height="12" rx="6" class="track"/>
    <rect x="290" y="100" width="246" height="12" rx="6" class="fill"/>
    <text x="580" y="112" class="lvl">shipped</text><text x="730" y="112" class="note">3 deployed apps</text>
  </g>
  <g>
    <text x="56" y="146" class="name">HTML &#183; CSS &#183; JavaScript</text>
    <rect x="290" y="134" width="270" height="12" rx="6" class="track"/>
    <rect x="290" y="134" width="225" height="12" rx="6" class="fill"/>
    <text x="580" y="146" class="lvl">solid</text><text x="730" y="146" class="note">since day one</text>
  </g>
  <g>
    <text x="56" y="180" class="name">Supabase &#183; Stripe</text>
    <rect x="290" y="168" width="270" height="12" rx="6" class="track"/>
    <rect x="290" y="168" width="207" height="12" rx="6" class="fill"/>
    <text x="580" y="180" class="lvl">shipped</text><text x="730" y="180" class="note">Iron Fortress</text>
  </g>
  <g>
    <text x="56" y="214" class="name">Python</text>
    <rect x="290" y="202" width="270" height="12" rx="6" class="track"/>
    <rect x="290" y="202" width="189" height="12" rx="6" class="fill"/>
    <text x="580" y="214" class="lvl">PCAP certified</text><text x="730" y="214" class="note">Python Institute</text>
  </g>
  <g>
    <text x="56" y="248" class="name">RAG &#183; Embeddings &#183; LLMs</text>
    <rect x="290" y="236" width="270" height="12" rx="6" class="track"/>
    <rect x="290" y="236" width="180" height="12" rx="6" class="fill"/>
    <text x="580" y="248" class="lvl">core focus</text><text x="730" y="248" class="note">Cyberpunk Hub</text>
  </g>
  <g>
    <text x="56" y="282" class="name">AWS</text>
    <rect x="290" y="270" width="270" height="12" rx="6" class="track"/>
    <rect x="290" y="270" width="126" height="12" rx="6" class="fill"/>
    <text x="580" y="282" class="lvl2">certified</text><text x="730" y="282" class="note">Cloud Practitioner</text>
  </g>
  <g>
    <text x="56" y="316" class="name">Java</text>
    <rect x="290" y="304" width="270" height="12" rx="6" class="track"/>
    <rect x="290" y="304" width="108" height="12" rx="6" class="fill"/>
    <text x="580" y="316" class="lvl2">foundations</text><text x="730" y="316" class="note">Oracle 1Z0-811</text>
  </g>

  <text x="56" y="366" class="note">every bar points at a repository or a certificate &#8212; open any of them and ask</text>
</svg>
