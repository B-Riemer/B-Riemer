<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Björn Riemer — AI Application Developer, agent session, Hamburg">
  <defs>
    <linearGradient id="accent" x1="56" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="0.8" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect class="typeReveal" x="56" y="152" width="520" height="30"/>
    </clipPath>
    <style>
      text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .ui { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
      .typeReveal { transform-origin: 56px 152px; animation: type 2.6s steps(46, end) 1.2s both; }
      @keyframes type { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .cursor { animation: blink 1.1s steps(1) infinite 3.9s; }
      @keyframes blink { 50% { opacity: 0; } }
      .fadeIn { animation: fadeIn 0.7s ease-out both; }
      .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.7s; }
      .d3 { animation-delay: 4.0s; } .d4 { animation-delay: 4.4s; } .d5 { animation-delay: 4.8s; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- window -->
  <rect width="960" height="320" rx="14" fill="#0b1020"/>
  <rect x="0.5" y="0.5" width="959" height="319" rx="13.5" stroke="#ffffff" stroke-opacity="0.09"/>
  <path d="M0 14C0 6.268 6.268 0 14 0H946C953.732 0 960 6.268 960 14V38H0V14Z" fill="#0d1424"/>
  <line x1="0" y1="38" x2="960" y2="38" stroke="#ffffff" stroke-opacity="0.07"/>
  <circle cx="24" cy="19" r="5.5" fill="#ff5f57"/>
  <circle cx="44" cy="19" r="5.5" fill="#febc2e"/>
  <circle cx="64" cy="19" r="5.5" fill="#28c840"/>
  <text x="480" y="24" font-size="13" fill="#8b95b5" text-anchor="middle">bjorn@hamburg: ~ — ai-session</text>

  <!-- session log -->
  <g class="fadeIn d1">
    <text x="56" y="76" font-size="15"><tspan fill="#22d3ee" font-weight="700">&#10095;</tspan><tspan fill="#e2e8f0" xml:space="preserve"> claude --resume </tspan><tspan fill="#a5f3a5">bjorn-riemer</tspan></text>
  </g>

  <g class="fadeIn d2">
    <text x="56" y="128" font-size="38" font-weight="700" fill="#f1f5ff" class="ui">Björn Riemer</text>
  </g>

  <g clip-path="url(#typeClip)">
    <text x="56" y="174" font-size="18" font-weight="600" fill="url(#accent)">AI Application Developer — agents &amp; automation</text>
  </g>
  <rect class="cursor" x="576" y="156" width="9" height="22" fill="#22d3ee"/>

  <g class="fadeIn d3">
    <text x="56" y="212" font-size="14"><tspan fill="#c084fc">&#10022;</tspan><tspan fill="#8b95b5" xml:space="preserve"> 15+ years of leadership &#8594; now shipping AI-powered software</tspan></text>
  </g>
  <g class="fadeIn d4">
    <text x="56" y="238" font-size="14"><tspan fill="#c084fc">&#10022;</tspan><tspan fill="#5f6a8c" xml:space="preserve"> Hamburg, Germany &#183; b-riemer.dev &#183; IHK track: Fachinformatiker AE</tspan></text>
  </g>

  <g class="fadeIn d5">
    <circle class="pulse" cx="62" cy="278" r="4.5" fill="#4ade80"/>
    <text x="78" y="283" font-size="13.5"><tspan fill="#4ade80">session active</tspan><tspan fill="#5f6a8c" xml:space="preserve">  &#183;  open to AI &amp; dev opportunities  &#183;  replies in DE / EN</tspan></text>
  </g>

  <rect x="0" y="316" width="960" height="3" fill="url(#line)"/>
</svg>
